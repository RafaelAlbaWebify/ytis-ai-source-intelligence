name: Playwright Local Import and Cards

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-import-and-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright dependencies
        run: python -m pip install -r requirements-playwright.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run local import and card library journey
        env:
          PYTHONPATH: src
        run: python tools/playwright_local_import_and_cards.py

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-import-and-cards-evidence
          path: artifacts/local-import-and-cards/
          if-no-files-found: warn
          retention-days: 14
