name: Playwright Technical Research Workbench

on:
  pull_request:
  push:
    branches:
      - main
      - feature/technical-research-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  technical-research-workbench:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Chromium and operating-system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run technical research workbench proof
        env:
          PYTHONPATH: src
        run: python tools/playwright_technical_research_workbench.py

      - name: Upload technical research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-technical-research-workbench
          path: artifacts/technical-research-workbench/
          if-no-files-found: warn
          retention-days: 14
