name: Playwright Reusable Outputs Workbench

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reusable-outputs-workbench:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run reusable output workbench journey
        env:
          PYTHONPATH: src
        run: python tools/playwright_reusable_outputs_workbench.py

      - name: Upload reusable output evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reusable-output-workbench-evidence
          path: artifacts/reusable-outputs-workbench/
          if-no-files-found: warn
          retention-days: 14
