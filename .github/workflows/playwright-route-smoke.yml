name: Playwright Route Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - audit/playwright-route-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt

      - name: Install Chromium and operating-system dependencies
        run: python -m playwright install --with-deps chromium

      - name: Run route smoke test
        env:
          PYTHONPATH: src
        run: python tools/playwright_route_smoke.py

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-route-smoke
          path: artifacts/playwright/
          if-no-files-found: warn
          retention-days: 14
