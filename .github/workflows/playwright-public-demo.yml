name: Playwright Public Demo

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright dependencies
        run: python -m pip install -r requirements-playwright.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run public demo journey
        env:
          PYTHONPATH: src
        run: python tools/playwright_public_demo.py

      - name: Upload public demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-demo-evidence
          path: artifacts/public-demo/
          if-no-files-found: warn
          retention-days: 14
